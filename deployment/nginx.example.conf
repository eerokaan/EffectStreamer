map $http_upgrade $est_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name study.example.org;
    
    root /var/www/effectstreamer;
    include /etc/nginx/mime.types;
    index index.html;

    access_log /dev/null;
    error_log /dev/null;

    ssl_certificate /etc/letsencrypt/live/study.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.org/privkey.pem;
    
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), speaker-selection=(self)" always;

    # ===== Routes to webserver ===============
    location = /experiment {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # ===== Routes to est-server ===============
    location /api/ {
        client_max_body_size 2M;
        proxy_pass http://127.0.0.1:3000;
    }
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $est_connection_upgrade;
        proxy_pass http://127.0.0.1:3000;
    }
}
