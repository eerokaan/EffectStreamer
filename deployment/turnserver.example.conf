# Copy this optional coturn example to private turnserver.local.conf before editing.
# Replace DNS/IP/certificate paths and the secret; do not run this template as-is.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=REPLACE_WITH_PUBLIC_IP
realm=turn.example.org
server-name=turn.example.org
cert=/absolute/path/to/fullchain.pem
pkey=/absolute/path/to/privkey.pem
min-port=60000
max-port=60999
use-auth-secret

# Must match the server's private EST_TURN_SECRET environment value.
static-auth-secret=REPLACE_WITH_PRIVATE_RANDOM_SECRET
fingerprint
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers

# Block private/LAN relay targets; use publicly reachable core ICE candidates.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-tlsv1
no-tlsv1_1
user-quota=12
total-quota=120
log-file=stdout
simple-log
