appId: de.tu-berlin.qu.effectstreamer.gui
productName: EffectStreamer
copyright: Eero Kaan | Quality and Usability Lab | TU Berlin

directories:
    buildResources: build
    output: dist

beforePack: ./build_scripts/beforePack.js

extraResources:
    - from: "public/audio"
      to: "audio"

linux:
    target:
        - AppImage
    category: Utility
    extraResources:
        - from: "build/linux"
          to: "est-core"
          filter:
              - "est-core"
              - "gst-lib/**/*"

win:
    target:
        - nsis
    extraResources:
        - from: "build/win"
          to: "est-core"
          filter:
              - "est-core.exe"
              - "gst-lib/**/*"
