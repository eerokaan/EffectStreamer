<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../../css/short-conversation-test.css" />
    </head>

    <body>
        <div class="card">
            <div class="card-header">
                <h1 data-translate>Internet contract</h1>
            </div>
            <table class="main-table">
                <tr>
                    <td class="icon-cell">
                        <div class="wrapper">
                            <img src="../../../img/short-conversation-test/icons/icon-caller.png" />
                        </div>
                    </td>
                    <td class="content-cell">
                        <div class="headline" data-translate>Your name</div>
                        <div class="value" data-translate>Thibaud Richter</div>
                    </td>
                </tr>
                <tr>
                    <td class="icon-cell">
                        <div class="wrapper">
                            <img src="../../../img/short-conversation-test/icons/icon-information.png" />
                        </div>
                    </td>
                    <td class="content-cell">
                        <div class="headline" data-translate>Information</div>
                        <div class="value" data-translate>Home internet access</div>
                    </td>
                </tr>
                <tr>
                    <td class="icon-cell">
                        <div class="wrapper">
                            <img src="../../../img/short-conversation-test/icons/icon-conditions.png" />
                        </div>
                    </td>
                    <td class="content-cell">
                        <div class="headline" data-translate>Requirements</div>
                        <div class="value value--gap">
                            <ul>
                                <li data-translate>Less than €30 per month</li>
                                <li data-translate>Contract term of no more than one year</li>
                                <li data-translate>DSL speed &gt; 10 Mbit/s</li>
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="icon-cell">
                        <div class="wrapper">
                            <img src="../../../img/short-conversation-test/icons/icon-folder-in.png" />
                        </div>
                    </td>
                    <td class="content-cell">
                        <div class="headline" data-translate>Information to ask for</div>
                        <div class="gap-grid">
                            <div class="gap-row">
                                <span class="field-label" data-translate>Price per month:</span>
                                <span class="gap-line"><input type="text" /></span>
                            </div>
                            <div class="gap-row">
                                <span class="field-label" data-translate>DSL speed:</span>
                                <span class="gap-line"><input type="text" /></span>
                            </div>
                            <div class="gap-row">
                                <span class="field-label" data-translate>Contract term:</span>
                                <span class="gap-line"><input type="text" /></span>
                            </div>
                            <div class="gap-row">
                                <span class="field-label" data-translate>Router cost:</span>
                                <span class="gap-line"><input type="text" /></span>
                            </div>
                            <div class="gap-row gap-row--items-below">
                                <span class="field-label"></span>
                                <div class="list-badges">
                                    <div class="list-item">
                                        <span class="checkbox"><input type="checkbox" /></span>
                                        <span data-translate>Phone</span>
                                    </div>
                                    <div class="list-item">
                                        <span class="checkbox"><input type="checkbox" /></span>
                                        <span data-translate>TV</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
